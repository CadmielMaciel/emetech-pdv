<!-- Fatia 57: tema claro/escuro igual ao sistema. Usa a escolha salva no
     MISU SYS (se for o mesmo aparelho) ou o tema do aparelho do cliente, e
     declara isso pro navegador não escurecer a página por conta própria. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1E5EFF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/entregas-32.png">
<link rel="apple-touch-icon" href="icons/entregas-apple-180.png">
<script>
(function(){
  function temaAtual(){
    var t=null; try{ t=localStorage.getItem('misu_tema'); }catch(e){}
    if(t!=='dark'&&t!=='light') t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    return t;
  }
  document.documentElement.setAttribute('data-theme',temaAtual());
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
    document.documentElement.setAttribute('data-theme',temaAtual());
    if(typeof window._aoTrocarTema==='function') window._aoTrocarTema();
  }); }catch(e){}
})();
/* Cor de texto legível a partir de uma cor de status/marca: mantém o tom e
   escurece (tema claro) ou clareia (tema escuro) até 4,5:1 sobre os cartões. */
function corTxt(cor){
  var h=String(cor||'').trim().replace('#','');
  if(/^[0-9a-f]{3}$/i.test(h)) h=h.split('').map(function(c){return c+c;}).join('');
  if(!/^[0-9a-f]{6}$/i.test(h)) return cor;
  var c=[0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16);});
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var lum=function(x){var f=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(x[0])+0.7152*f(x[1])+0.0722*f(x[2]);};
  var con=function(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);};
  var fundos=dark?[[7,11,26],[14,23,48],[19,32,74],[40,48,80]]:[[255,255,255],[245,242,236],[239,233,223],[228,224,218]]; /* inclui os fundos tingidos dos selos */
  var alvo=dark?[255,255,255]:[0,0,0], t=c;
  for(var i=1;i<=20&&Math.min.apply(null,fundos.map(function(f){return con(t,f);}))<4.5;i++) t=c.map(function(v,k){return v+(alvo[k]-v)*i/20;});
  return '#'+t.map(function(v){return Math.round(v).toString(16).padStart(2,'0');}).join('');
}
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;--pri:#1E5EFF;--pri-btn2:#1A4FD9;--pri-txt:#1A52E0;--pri-soft:#EEF3FF;--bg:#F5F2EC;--bg2:#FFFFFF;--bg3:#F7F4EF;--input:#FFFFFF;--txt:#1E1530;--txt2:#54487A;--txt3:#665A88;--border:#E6DED3;--ok:#05704F;--warn:#92400E;--ok-bg:#E7F6EC;--warn-bg:#FDF0E0;--skel1:#EFE9DE;--skel2:#F7F4EF;--toast:#1E1530;--sombra:0 4px 24px rgba(0,0,0,.06)}
[data-theme="dark"]{color-scheme:dark;--pri-txt:#8AB0FF;--pri-soft:rgba(30,94,255,.20);--bg:#070B1A;--bg2:#0E1730;--bg3:#13204A;--input:#0A1229;--txt:#EAF0FF;--txt2:#A8BAE8;--txt3:#93A4D6;--border:#1B2A55;--ok:#4ADE80;--warn:#FBBF24;--ok-bg:rgba(74,222,128,.12);--warn-bg:rgba(251,191,36,.12);--skel1:#13204A;--skel2:#1B2A55;--toast:#EAF0FF;--sombra:0 8px 32px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:16px}
.wrap{max-width:460px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--sombra)}
.logo{text-align:center;margin-bottom:14px;font-weight:800;font-size:20px;color:var(--pri-txt);display:flex;flex-direction:column;align-items:center;gap:8px}
.logo::before{content:"";width:56px;height:56px;border-radius:15px;background:url(icons/entregas-192.png) center/cover;box-shadow:0 6px 18px rgba(30,94,255,.30)} /* ícone das entregas */
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--txt2);font-size:13px;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.opt{display:flex;gap:10px;margin:16px 0}
.opt button{flex:1;padding:14px;border:2px solid var(--border);border-radius:14px;background:var(--input);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--txt)}
.opt button.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-txt)}
label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 4px}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--input)}
input:focus,textarea:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chk{display:flex;gap:9px;align-items:center;margin:16px 0 6px;font-size:13px}
.chk input{width:auto}
.btn{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri-btn2));color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
.hide{display:none}
.msg{text-align:center;padding:34px 10px;font-size:15px;line-height:1.6;white-space:pre-line}
.msg .sub2{display:block;font-size:12.5px;color:var(--txt3);margin-top:6px}
.store{font-size:12.5px;color:var(--txt2);background:var(--bg3);border-radius:12px;padding:12px;margin:12px 0}

/* ── Fatia 14: motion leve — mesmo kill-switch já usado em app.html/
   catalogo.html/os.html/orcamento.html (faltava aqui) ── */
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ── Fatia 14: entrada suave do card ── */
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{animation:cardIn .35s ease}

/* ── Fatia 14: status da entrega (mapeado do enum real da tabela `entregas`) ── */
.st-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:10px}
/* Fatia 57: o selo pulsa com um anel em volta; o texto fica sempre nítido (antes o texto inteiro piscava até 55%) */
.st-pill.pulse{animation:stAnel 2s ease-out infinite}
@keyframes stAnel{0%{box-shadow:0 0 0 0 rgba(30,94,255,.45)}70%{box-shadow:0 0 0 8px rgba(30,94,255,0)}100%{box-shadow:0 0 0 0 rgba(30,94,255,0)}}
@keyframes stPulse{0%,100%{opacity:1}50%{opacity:.55}}
.previsto{font-size:12px;color:var(--txt2);margin:-4px 0 12px}

/* ── Fatia 14: linha do tempo (só aparece se a RPC devolver eventos reais) ── */
.tl{margin:14px 0 4px}
.tl-item{display:flex;gap:10px;padding:6px 0;font-size:12.5px}
.tl-item .dot{width:9px;height:9px;border-radius:50%;background:var(--border);margin-top:4px;flex-shrink:0}
.tl-item.atual .dot{background:var(--pri);animation:stPulse 2s ease-in-out infinite}
.tl-item b{display:block;color:var(--txt)}
.tl-item span{color:var(--txt3);font-size:11px}
.tl-vazio{font-size:12px;color:var(--txt3);text-align:center;padding:10px 0}

/* ── Fatia 14: botão de WhatsApp (não existia neste arquivo) ── */
.btn-wpp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;background:#15803D;color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;margin-top:10px;transition:transform .12s ease}
.btn-wpp:active{transform:scale(.98)}

/* ── Fatia 14: skeleton loading ── */
.skel{background:linear-gradient(90deg,var(--skel1) 25%,var(--skel2) 37%,var(--skel1) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:12px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── Fatia 14: copiar link ── */
.copiar-link{display:inline-flex;align-items:center;gap:5px;color:var(--txt3);font-size:11px;background:none;border:none;cursor:pointer;margin-top:10px;font-family:inherit;padding:4px}
.copiar-link:active{color:var(--pri-txt)}
#copia-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:var(--toast);color:var(--bg);border:none;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:400;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#copia-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card">
    <div class="skel" style="height:20px;width:60%;margin:0 auto 18px"></div>
    <div class="skel" style="height:14px;width:40%;margin:0 auto 20px"></div>
    <div class="skel" style="height:80px;margin-bottom:12px"></div>
    <div class="skel" style="height:44px"></div>
  </div>
</div>
<div id="copia-toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SURL='https://icgfpfwcnhkjglrmnuca.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZ2ZwZndjbmhramdscm1udWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODA2OTEsImV4cCI6MjA5NTY1NjY5MX0.xDGiGCIlqXaqdWhWo0NoNi_XUdlw5raCogO_Jnc0ezw';
const db=supabase.createClient(SURL,SKEY);
const token=new URLSearchParams(location.search).get('t');
let E=null, forma='entrega', _wppBtnHtml='';

// Fatia 14: enum real de status da tabela `entregas` (confirmado em index.html —
// sincronizarEntregas()/_cardEntrega()): para_agendar, agendada, em_rota, entregue,
// cancelada. Não existe "Em separação"/"Não entregue" no sistema — não inventei.
// "Aguardando pagamento" também não é um status aqui, é o campo separado `pago`.
// Fatia 21: dois valores novos, gravados pelo app mobile do entregador —
// 'proximo_destino' (ação manual, sem GPS real) e 'tentativa' (tentativa de
// entrega registrada, não concluída). Mapeados aqui só como texto humano,
// sem inventar nenhum status novo. ⚠️ ASSUNÇÃO TÉCNICA: não confirmei se a
// RPC `entrega_publica` já devolve esses dois valores no campo `status` pro
// portal público — se ela não devolver, o cliente simplesmente não vê essa
// mudança aqui até a RPC ser ajustada (ver pendências no relatório).
const ENTREGA_STATUS = {
  para_agendar:{label:'Pedido recebido',cor:'#d97706',bg:'rgba(217,119,6,.14)'},
  agendada:{label:'Entrega agendada',cor:'#1E5EFF',bg:'rgba(30,94,255,.14)'},
  em_rota:{label:'Saiu para entrega',cor:'#1E5EFF',bg:'rgba(30,94,255,.14)'},
  proximo_destino:{label:'A caminho — perto de você',cor:'#1E5EFF',bg:'rgba(30,94,255,.14)'},
  tentativa:{label:'Tentativa de entrega — aguardando novo contato',cor:'#d97706',bg:'rgba(217,119,6,.14)'},
  entregue:{label:'Entregue',cor:'#16a34a',bg:'rgba(22,163,74,.14)'},
  cancelada:{label:'Cancelada',cor:'#8A8296',bg:'rgba(138,130,150,.16)'}
};

// Fatia 57: ao trocar o tema do aparelho, só recalcula a cor do status
// (não redesenha a tela pra não apagar o que o cliente já digitou).
window._aoTrocarTema=function(){ document.querySelectorAll('[data-cor]').forEach(el=>{ el.style.color=corTxt(el.dataset.cor); }); };
function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function erro(m){ document.getElementById('app').innerHTML=`<div class="card"><div class="msg">⚠️<br>${esc(m)}</div></div>`; }

async function load(){
  if(!token || token.length < 32){ return erro('Link inválido ou incompleto.\nConfira se o link está correto.'); }
  try{
    const { data, error } = await db.rpc('entrega_publica', { tok: token });
    if(error){ return erro('Não foi possível carregar agora.\nTente novamente em alguns instantes.'); }
    if(!data){ return erro('Não encontramos esta entrega.\nConfira se o link está correto.'); }
    if(data.ok===false){ return erro(data.expirado?'Este link expirou. Peça um novo à loja.':'Esta entrega não está mais disponível.'); }
    E=data; forma=data.forma||'entrega'; render();
  }catch(e){ erro('Não foi possível carregar agora.\nTente novamente em alguns instantes.'); }
}

function render(){
  const d=E.dados||{};
  const pago = E.pago
    ? '<span class="badge ok">✓ Pagamento confirmado</span>'
    : '<span class="badge warn">⚠ Pagamento pendente</span>';
  const jaFeito = E.dados_preenchidos ? '<div class="store">✓ Você já enviou seus dados. Pode reenviar para atualizar.</div>' : '';

  // Fatia 14: status real da entrega — só aparece se a RPC devolver o campo
  // `status` (assunção técnica — não confirmei se `entrega_publica` já
  // devolve isso hoje). Status desconhecido mostra o valor bruto, sem
  // inventar rótulo nem herdar cor de outro status.
  const stKey = E.status;
  const st = stKey ? (ENTREGA_STATUS[stKey] || {label:stKey,cor:'#8A8296',bg:'rgba(138,130,150,.16)'}) : null;
  const stPill = st ? `<span class="st-pill${(stKey==='em_rota'||stKey==='proximo_destino')?' pulse':''}" data-cor="${st.cor}" style="color:${corTxt(st.cor)};background:${st.bg}">${esc(st.label)}</span>` : '';

  // Fatia 14: "previsto para" — só mostro se já existir uma data definida
  // (não é uma previsão inventada, é o próprio campo data_agendada/janela
  // que já existia no arquivo, só que antes só aparecia dentro do formulário).
  const previsto = E.data_agendada ? `<div class="previsto">📅 Previsto para ${esc(E.data_agendada.split('-').reverse().join('/'))}${E.janela?' · '+esc(E.janela):''}</div>` : '';

  // Fatia 14: linha do tempo — só renderiza se a RPC realmente devolver uma
  // lista de eventos. Não encontrei essa função no projeto (entrega.html
  // não lia nenhum campo de histórico antes desta fatia) — assunção técnica.
  const eventos = Array.isArray(E.timeline) ? E.timeline : (Array.isArray(E.historico) ? E.historico : (Array.isArray(E.eventos) ? E.eventos : null));
  const timelineHtml = eventos ? `<div class="tl">
      ${eventos.length ? eventos.map((ev,i)=>`<div class="tl-item${i===eventos.length-1?' atual':''}"><div class="dot"></div><div><b>${esc(ev.status||ev.titulo||'')}</b><span>${ev.data?esc(new Date(ev.data).toLocaleString('pt-BR')):''}${ev.descricao?' · '+esc(ev.descricao):''}</span></div></div>`).join('') : '<div class="tl-vazio">As atualizações da entrega aparecerão aqui.</div>'}
    </div>` : '';

  // Fatia 14: WhatsApp — não existia nenhum botão neste arquivo antes.
  // Telefone da loja: assunção técnica sobre o nome do campo (tentei vários).
  const wppNum = (E.loja_whatsapp||E.whatsapp||E.empresa_whatsapp||E.telefone_loja||'').replace(/\D/g,'');
  const numEntrega = E.numero||E.numero_entrega||E.pedido_numero||null; // não encontrei campo "número" na entrega — uso se existir
  const msgWpp = numEntrega
    ? (stKey==='em_rota'
        ? `Olá, estou aguardando minha entrega nº ${numEntrega}. Pode me passar uma atualização?`
        : `Olá, estou acompanhando minha entrega nº ${numEntrega}. Pode me informar a situação?`)
    : (stKey==='em_rota'
        ? `Olá, estou aguardando minha entrega${E.descricao?(' ('+E.descricao+')'):''}. Pode me passar uma atualização?`
        : `Olá, estou acompanhando minha entrega${E.descricao?(' ('+E.descricao+')'):''}. Pode me informar a situação?`);
  const wppBtn = wppNum ? `<a class="btn-wpp" target="_blank" href="https://wa.me/${wppNum}?text=${encodeURIComponent(msgWpp)}">💬 Falar com a loja</a>` : '';
  _wppBtnHtml = wppBtn;

  document.getElementById('app').innerHTML=`<div class="card">
    <div class="logo">${esc(E.loja_nome||'Portal de Entrega')}</div>
    ${stPill?`<div>${stPill}</div>`:''}
    <h1>Como você prefere receber?</h1>
    <div class="sub">${esc(E.descricao||'')}</div>
    ${previsto}
    <div>${pago}</div>
    ${jaFeito}
    ${timelineHtml}
    <div class="opt">
      <button id="op-e" onclick="setForma('entrega')">🚚 Receber no endereço</button>
      <button id="op-r" onclick="setForma('retirada')">🏬 Retirar na loja</button>
    </div>
    <div id="form-entrega">
      <label>Nome do recebedor *</label><input id="f-rec" value="${esc(d.rec_nome)}">
      <label>Telefone</label><input id="f-tel" inputmode="tel" value="${esc(d.rec_telefone)}">
      <div class="row"><div><label>CEP</label><input id="f-cep" inputmode="numeric" value="${esc(d.cep)}"></div><div><label>UF</label><input id="f-uf" maxlength="2" style="text-transform:uppercase" value="${esc(d.uf)}"></div></div>
      <label>Rua *</label><input id="f-rua" value="${esc(d.rua)}">
      <div class="row"><div><label>Número *</label><input id="f-num" value="${esc(d.numero)}"></div><div><label>Complemento</label><input id="f-comp" value="${esc(d.complemento)}"></div></div>
      <label>Bairro</label><input id="f-bairro" value="${esc(d.bairro)}">
      <label>Cidade *</label><input id="f-cidade" value="${esc(d.cidade)}">
      <label>Ponto de referência</label><input id="f-ref" value="${esc(d.referencia)}">
    </div>
    <div id="form-retirada" class="hide"><div class="store">Você retira na loja${E.loja_nome?(' — '+esc(E.loja_nome)):''}. Escolha a data desejada abaixo.</div>
      <label>Nome de quem vai retirar *</label><input id="f-rec-r" value="${esc(d.rec_nome)}">
    </div>
    <div class="row"><div><label>Data desejada</label><input id="f-data" type="date" value="${esc(E.data_agendada)}"></div><div><label>Janela</label><input id="f-jan" placeholder="14h-18h" value="${esc(E.janela)}"></div></div>
    <label>Observações</label><textarea id="f-obs" rows="2">${esc(d.observacoes)}</textarea>
    <div class="chk"><input type="checkbox" id="f-conf"><label for="f-conf" style="margin:0">Confirmo que os dados acima estão corretos.</label></div>
    <button class="btn" id="btn-conf" onclick="confirmar()">CONFIRMAR ${forma==='retirada'?'RETIRADA':'ENTREGA'}</button>
    ${wppBtn}
    <div style="text-align:center"><button class="copiar-link" onclick="copiarLinkPagina()">🔗 Copiar link desta entrega</button></div>
  </div>`;
  setForma(forma);
}

function setForma(f){
  forma=f;
  document.getElementById('op-e').classList.toggle('sel',f==='entrega');
  document.getElementById('op-r').classList.toggle('sel',f==='retirada');
  document.getElementById('form-entrega').classList.toggle('hide',f==='retirada');
  document.getElementById('form-retirada').classList.toggle('hide',f!=='retirada');
  const b=document.getElementById('btn-conf'); if(b) b.textContent='CONFIRMAR '+(f==='retirada'?'RETIRADA':'ENTREGA');
}

async function confirmar(){
  if(!document.getElementById('f-conf').checked){ alert('Marque a confirmação dos dados.'); return; }
  const g=id=>(document.getElementById(id)?.value||'').trim();
  const p={ forma, data:g('f-data'), janela:g('f-jan'), observacoes:g('f-obs'), referencia:g('f-ref') };
  if(forma==='entrega'){
    Object.assign(p,{ rec_nome:g('f-rec'), rec_telefone:g('f-tel'), cep:g('f-cep'), rua:g('f-rua'),
      numero:g('f-num'), complemento:g('f-comp'), bairro:g('f-bairro'), cidade:g('f-cidade'), uf:g('f-uf') });
    if(!p.rec_nome||!p.rua||!p.numero||!p.cidade){ alert('Preencha: nome, rua, número e cidade.'); return; }
  } else {
    p.rec_nome=g('f-rec-r');
    if(!p.rec_nome){ alert('Informe o nome de quem vai retirar.'); return; }
  }
  const btn=document.getElementById('btn-conf'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    const { data, error } = await db.rpc('entrega_publica_confirmar', { tok:token, p, ua:navigator.userAgent });
    if(error||!data||data.ok===false){ throw new Error(); }
    document.getElementById('app').innerHTML=`<div class="card"><div class="msg">✅<br><b>${forma==='retirada'?'Retirada':'Entrega'} confirmada!</b><br><span style="color:var(--txt2);font-size:13px">A loja recebeu seus dados. Obrigado!</span></div>${_wppBtnHtml}</div>`;
  }catch(e){ btn.disabled=false; btn.textContent='Tentar novamente'; alert('Não foi possível confirmar. Verifique os dados e tente de novo.'); }
}

// Fatia 14: copiar link — mesmo padrão de os.html/orcamento.html/catalogo.html.
function copiarLinkPagina(){
  const url = location.href;
  const done = () => _toastCopia('Link copiado!');
  const fail = () => _toastCopia('Não foi possível copiar.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(fail);
  }else{
    try{
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ fail(); }
  }
}
function _toastCopia(msg){
  const t = document.getElementById('copia-toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}

load();
